                    <input type="text" id="nama_perusahaan" required placeholder="Contoh: PT Trans Logistik" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Jenis Kendaraan</label>
                    <select id="jenis_kendaraan" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-red-500 outline-none">
                        <option value="">Pilih Jenis Kendaraan</option>
                        <option value="Colt Diesel / CDE">Colt Diesel / CDE (4 Roda)</option>
                        <option value="Fuso / CDD">Fuso / CDD (6 Roda)</option>
                        <option value="Tronton">Tronton (10 Roda)</option>
                        <option value="Wingbox">Wingbox</option>
                        <option value="Container 20ft/40ft">Container 20ft / 40ft</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Tujuan Kirim</label>
                    <input type="text" id="tujuan_kirim" required placeholder="Contoh: Warehouse Cabang Surabaya / Pelabuhan Tanjung Priok" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Petugas Gudang</label>
                    <input type="text" id="nama_petugas" required placeholder="Nama petugas jaga" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 text-sm shadow-sm">
                    Simpan & Catat Kedatangan
                </button>
            </form>
        </section>

        <!-- Dashboard & Tabel Laporan -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-2 flex flex-col">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4 pb-2 border-b">
                <h2 class="text-lg font-semibold text-slate-800">Daftar Kendaraan Masuk</h2>
                <div class="flex items-center gap-2">
                    <button onclick="exportExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-lg font-medium transition shadow-sm">Ekspor Excel</button>
                    <button onclick="exportPDF()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs px-3 py-2 rounded-lg font-medium transition shadow-sm">Ekspor PDF</button>
                </div>
            </div>

            <!-- Filter & Pencarian -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                <input type="text" id="searchKeyword" placeholder="Cari No. Plat, Supir, atau Tujuan..." onkeyup="renderTable()" class="border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-red-500">
                <input type="date" id="filterTanggal" onchange="renderTable()" class="border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-red-500">
            </div>

            <!-- Tabel Data -->
            <div id="tableContainer" class="overflow-x-auto flex-1 border border-slate-100 rounded-lg">
                <table id="tabelLaporan" class="w-full text-left border-collapse text-xs md:text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700 border-b">
                            <th class="p-3">Waktu Kedatangan</th>
                            <th class="p-3">No. Plat</th>
                            <th class="p-3">Supir / Ekspedisi</th>
                            <th class="p-3">Jenis Kendaraan</th>
                            <th class="p-3">Tujuan Kirim</th>
                            <th class="p-3">Petugas</th>
                        </tr>
                    </thead>
                    <tbody id="listKendaraan" class="divide-y divide-slate-100">
                        <!-- Data dimuat lewat JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- JavaScript Aplikasi -->
    <script>
        let dataKendaraan = JSON.parse(localStorage.getItem('data_kendaraan')) || [
            {
                id: 1,
                waktu_kedatangan: new Date().toISOString(),
                nomor_plat: "B 9182 UXX",
                nama_supir: "Budi Santoso",
                nama_perusahaan: "PT Trans Logistik",
                jenis_kendaraan: "Fuso / CDD",
                tujuan_kirim: "Warehouse Cabang Surabaya",
                nama_petugas: "Ahmad Jaelani"
            },
            {
                id: 2,
                waktu_kedatangan: new Date(Date.now() - 3600000).toISOString(),
                nomor_plat: "T 4321 BC",
                nama_supir: "Joko Widodo",
                nama_perusahaan: "CV Surya Makmur",
                jenis_kendaraan: "Colt Diesel / CDE",
                tujuan_kirim: "Pelabuhan Tanjung Priok",
                nama_petugas: "Rian Hidayat"
            }
        ];

        function renderTable() {
            const search = document.getElementById('searchKeyword').value.toLowerCase();
            const tanggal = document.getElementById('filterTanggal').value;
            const tbody = document.getElementById('listKendaraan');
            tbody.innerHTML = '';

            let filtered = dataKendaraan.filter(item => {
                const matchSearch = item.nomor_plat.toLowerCase().includes(search) || 
                                    item.nama_supir.toLowerCase().includes(search) || 
                                    item.tujuan_kirim.toLowerCase().includes(search) ||
                                    item.nama_perusahaan.toLowerCase().includes(search);
                
                let matchTanggal = true;
                if (tanggal) {
                    const itemDate = item.waktu_kedatangan.split('T')[0];
                    matchTanggal = (itemDate === tanggal);
                }
                return matchSearch && matchTanggal;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Tidak ada data kendaraan ditemukan.</td></tr>`;
                return;
            }

            filtered.sort((a, b) => new Date(b.waktu_kedatangan) - new Date(a.waktu_kedatangan));

            filtered.forEach(row => {
                let waktuFormat = new Date(row.waktu_kedatangan).toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
                let tanggalFormat = new Date(row.waktu_kedatangan).toLocaleDateString('id-ID', {day: '2-digit', month: 'short', year: 'numeric'});
                
                let tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition';
                tr.innerHTML = `
                    <td class="p-3 text-slate-500 whitespace-nowrap"><span class="font-medium text-slate-800">${tanggalFormat}</span><br>${waktuFormat} WIB</td>
                    <td class="p-3 font-bold text-slate-800">${row.nomor_plat}</td>
                    <td class="p-3 text-slate-700"><span class="font-medium">${row.nama_supir}</span><br><span class="text-xs text-slate-500">${row.nama_perusahaan}</span></td>
                    <td class="p-3 text-slate-600">${row.jenis_kendaraan}</td>
                    <td class="p-3 text-slate-700 font-medium text-red-600">${row.tujuan_kirim}</td>
                    <td class="p-3 text-slate-500">${row.nama_petugas}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('formKendaraan').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newData = {
                id: Date.now(),
                waktu_kedatangan: new Date().toISOString(),
                nomor_plat: document.getElementById('nomor_plat').value.toUpperCase(),
                nama_supir: document.getElementById('nama_supir').value,
                nama_perusahaan: document.getElementById('nama_perusahaan').value,
                jenis_kendaraan: document.getElementById('jenis_kendaraan').value,
                tujuan_kirim: document.getElementById('tujuan_kirim').value,
                nama_petugas: document.getElementById('nama_petugas').value
            };

            dataKendaraan.push(newData);
            localStorage.setItem('data_kendaraan', JSON.stringify(dataKendaraan));
            
            alert('Data kedatangan kendaraan berhasil dicatat!');
            this.reset();
            renderTable();

        // Real-time Clock
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            const dateStr = now.toLocaleDateString('id-ID', options);
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const clockEl = document.getElementById('realtimeClock');
            if (clockEl) {
                clockEl.textContent = `${dateStr} | ${timeStr} WIB`;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        });

        function exportExcel() {
            let table = document.getElementById("tabelLaporan");
            let wb = XLSX.utils.table_to_book(table, {sheet: "Laporan Kendaraan Masuk"});
            XLSX.writeFile(wb, "Laporan_Kendaraan_Masuk_Jembo.xlsx");
        }

        function exportPDF() {
            const element = document.getElementById("tableContainer");
            let opt = {
                margin:       0.5,
                filename:     'Laporan_Kendaraan_Masuk_Jembo.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'landscape' }
            };
            html2pdf().from(element).set(opt).save();
        }

        renderTable();

        // Real-time Clock
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            const dateStr = now.toLocaleDateString('id-ID', options);
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const clockEl = document.getElementById('realtimeClock');
            if (clockEl) {
                clockEl.textContent = `${dateStr} | ${timeStr} WIB`;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

    </script>
</body>
</html>
